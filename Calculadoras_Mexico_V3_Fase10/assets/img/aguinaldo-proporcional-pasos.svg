<svg xmlns="http://www.w3.org/2000/svg" width="640" height="740" viewBox="0 0 640 740" role="img" aria-labelledby="title desc">
<title id="title">Tu aguinaldo proporcional, paso a paso</title>
<desc id="desc">Con 15,000 pesos mensuales, 15 días de prestación y 180 días trabajados: salario diario 500 pesos, aguinaldo anual 7,500 pesos, proporcional 3,698.63 pesos brutos.</desc>
<rect width="640" height="740" rx="24" fill="#10283f"/>
<g font-family="Arial, sans-serif">
<text x="36" y="48" fill="#7de1cf" font-size="18" font-weight="700">CALCULADORAS MÉXICO · 2026</text>
<text x="36" y="92" fill="#fff" font-size="30" font-weight="700">Tu aguinaldo proporcional</text>
<text x="36" y="126" fill="#cad9e8" font-size="22">Un sueldo. Tres pasos. Un resultado.</text>
<rect x="28" y="156" width="584" height="124" rx="16" fill="#f2f7fb"/>
<circle cx="62" cy="193" r="19" fill="#087e70"/><text x="56" y="200" font-size="22" fill="#fff">1</text>
<text x="96" y="200" fill="#27435c" font-size="22">Convierte a salario diario</text>
<text x="56" y="249" fill="#10283f" font-size="32" font-weight="700">$15,000 ÷ 30 = $500</text>
<rect x="28" y="298" width="584" height="124" rx="16" fill="#f2f7fb"/>
<circle cx="62" cy="335" r="19" fill="#087e70"/><text x="56" y="342" font-size="22" fill="#fff">2</text>
<text x="96" y="342" fill="#27435c" font-size="22">Calcula la prestación anual</text>
<text x="56" y="391" fill="#10283f" font-size="32" font-weight="700">$500 × 15 días = $7,500</text>
<rect x="28" y="440" width="584" height="124" rx="16" fill="#f2f7fb"/>
<circle cx="62" cy="477" r="19" fill="#087e70"/><text x="56" y="484" font-size="22" fill="#fff">3</text>
<text x="96" y="484" fill="#27435c" font-size="22">Aplica los días trabajados</text>
<text x="56" y="533" fill="#10283f" font-size="30" font-weight="700">$7,500 × (180 ÷ 365)</text>
<text x="36" y="611" fill="#7de1cf" font-size="21">AGUINALDO PROPORCIONAL BRUTO</text>
<text x="36" y="661" fill="#fff" font-size="44" font-weight="700">$3,698.63 MXN</text>
<text x="36" y="707" fill="#cad9e8" font-size="19">Antes de ISR · Usa tus días reales, no meses redondeados.</text>
</g></svg>
